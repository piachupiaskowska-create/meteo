<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1729">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meteogram">
<meta name="format-detection" content="telephone=no">
<title>Meteogram — prognoza 7 dni</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0f1729; --panel:#182338; --panel2:#1e2b45; --text:#e8eef7;
    --muted:#93a2bd; --accent:#4f8cff; --line:#2a3a5a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(180deg,#0b1220,#0f1729); color:var(--text); min-height:100vh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap{max-width:760px; margin:0 auto; padding:18px 16px 56px}

  /* Ulubione */
  .favs{display:flex; gap:8px; flex-wrap:wrap}
  .chip{
    display:inline-flex; align-items:center; gap:8px; background:var(--panel);
    border:1px solid var(--line); border-radius:999px; padding:10px 6px 10px 15px; font-size:15px;
  }
  .chip .name{cursor:pointer}
  .chip .rm{
    background:var(--panel2); border:0; color:var(--muted); width:26px; height:26px; min-height:26px;
    border-radius:999px; padding:0; font-size:16px; line-height:1; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .chip .rm:active{color:#ff8a8a}
  .favs-empty{color:var(--muted); font-size:13px}

  .status{color:var(--muted); font-size:14px; padding:10px 2px; min-height:18px}
  .status.err{color:#ff8a8a}

  .current{
    display:none; align-items:center; gap:16px; background:var(--panel);
    border:1px solid var(--line); border-radius:16px; padding:18px; margin:12px 0 4px; position:relative;
  }
  .current .emoji{font-size:50px; line-height:1}
  .current .temp{font-size:38px; font-weight:700}
  .current .desc{font-size:15px}
  .current .meta{color:var(--muted); font-size:13px; margin-top:4px}
  .current .loc{color:var(--muted); font-size:13px}
  .starbtn{
    position:absolute; top:12px; right:12px; background:var(--panel2); border:1px solid var(--line);
    color:var(--text); font-size:14px; font-weight:600; padding:8px 12px; border-radius:999px; cursor:pointer;
  }
  .starbtn.on{background:#3a2f12; border-color:#7a5a1a; color:#ffd166}

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px 14px 6px; margin:14px 0}
  .panel h2{font-size:14px; font-weight:600; margin:0 0 6px}
  .chartbox{position:relative; height:200px}

  /* Sekcja wyszukiwania (na dole) */
  .searchsec{margin-top:26px; border-top:1px solid var(--line); padding-top:22px}
  .searchsec h2{font-size:15px; font-weight:600; margin:0 0 12px; color:var(--text)}
  .searchbar{display:flex; gap:8px; flex-wrap:wrap}
  input[type=text]{
    flex:1; min-width:160px; background:var(--panel); border:1px solid var(--line);
    color:var(--text); padding:14px; border-radius:12px; font-size:16px; outline:none;
  }
  input[type=text]:focus{border-color:var(--accent)}
  button{
    background:var(--accent); color:#fff; border:0; padding:14px 20px; border-radius:12px;
    font-size:16px; font-weight:600; cursor:pointer; min-height:48px;
  }
  button:active{filter:brightness(0.92)}
  .geo{width:100%; margin-top:8px; background:var(--panel); border:1px solid var(--line); color:var(--text)}
  select{
    background:var(--panel); border:1px solid var(--line); color:var(--text);
    padding:14px 12px; border-radius:12px; font-size:16px; margin-top:10px; width:100%;
  }
  .footer{color:var(--muted); font-size:12px; text-align:center; margin-top:22px}
  .footer a{color:var(--muted)}
  @media(max-width:480px){
    .searchbar button{flex:1}
    .current .temp{font-size:32px} .current .emoji{font-size:42px}
    .starbtn{position:static; margin-top:10px; display:inline-block}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- 1. Ulubione -->
  <div id="favsWrap"></div>
  <div class="status" id="status"></div>

  <!-- 2. Pogoda teraz -->
  <div class="current" id="current">
    <button class="starbtn" id="star">☆ Zapisz</button>
    <div class="emoji" id="curEmoji">☀️</div>
    <div>
      <div class="temp" id="curTemp">–</div>
      <div class="desc" id="curDesc"></div>
      <div class="meta" id="curMeta"></div>
      <div class="loc" id="curLoc"></div>
    </div>
  </div>

  <!-- 3. Wykresy -->
  <div id="charts" style="display:none">
    <div class="panel"><h2>Temperatura (°C)</h2><div class="chartbox"><canvas id="cTemp"></canvas></div></div>
    <div class="panel"><h2>Opady (mm) i szansa opadów (%)</h2><div class="chartbox"><canvas id="cPrecip"></canvas></div></div>
    <div class="panel"><h2>Szansa burzy (szacunkowa, %)</h2><div class="chartbox"><canvas id="cStorm"></canvas></div></div>
    <div class="panel"><h2>Zachmurzenie (%)</h2><div class="chartbox"><canvas id="cCloud"></canvas></div></div>
    <div class="panel"><h2>Wiatr i porywy (km/h)</h2><div class="chartbox"><canvas id="cWind"></canvas></div></div>
    <div class="panel"><h2>Wilgotność (%) i ciśnienie (hPa)</h2><div class="chartbox"><canvas id="cHumPres"></canvas></div></div>
  </div>

  <!-- 4. Wyszukiwanie (na dole) -->
  <div class="searchsec">
    <h2>Szukaj miejsca</h2>
    <div class="searchbar">
      <input type="text" id="q" placeholder="Wpisz miejscowość" autocomplete="off" enterkeyhint="search">
      <button id="go">Szukaj</button>
    </div>
    <button class="geo" id="geo">📍 Moja lokalizacja</button>
    <div id="picker"></div>
  </div>

  <div class="footer">Źródło danych: <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a></div>
</div>

<script>
const DAYS = ['nd','pn','wt','śr','cz','pt','sb'];
const WMO = {
  0:['Bezchmurnie','☀️'],1:['Przeważnie słonecznie','🌤️'],2:['Częściowe zachmurzenie','⛅'],3:['Pochmurno','☁️'],
  45:['Mgła','🌫️'],48:['Mgła osadzająca szron','🌫️'],
  51:['Mżawka','🌦️'],53:['Mżawka','🌦️'],55:['Silna mżawka','🌦️'],
  56:['Marznąca mżawka','🌧️'],57:['Marznąca mżawka','🌧️'],
  61:['Słaby deszcz','🌦️'],63:['Deszcz','🌧️'],65:['Ulewny deszcz','🌧️'],
  66:['Marznący deszcz','🌧️'],67:['Marznący deszcz','🌧️'],
  71:['Słaby śnieg','🌨️'],73:['Śnieg','🌨️'],75:['Obfity śnieg','❄️'],77:['Śnieg ziarnisty','🌨️'],
  80:['Przelotny deszcz','🌦️'],81:['Przelotny deszcz','🌧️'],82:['Gwałtowne opady','⛈️'],
  85:['Przelotny śnieg','🌨️'],86:['Przelotny śnieg','❄️'],
  95:['Burza','⛈️'],96:['Burza z gradem','⛈️'],99:['Burza z gradem','⛈️']
};
function wmo(code){ return WMO[code] || ['—','🌡️']; }

// Szacunkowa szansa burzy na podstawie CAPE (energii konwekcji) + kodu pogody
function stormChance(cape, code){
  let base = 0;
  if(cape != null){
    if(cape < 100) base = 0;
    else if(cape < 500) base = (cape-100)/400*20;
    else if(cape < 1500) base = 20 + (cape-500)/1000*45;
    else if(cape < 3000) base = 65 + (cape-1500)/1500*27;
    else base = 92;
  }
  if(code===95 || code===96 || code===99) base = Math.max(base, 85);
  return Math.round(Math.min(100, base));
}

function parseLocal(s){
  const [d,t] = s.split('T');
  const [y,mo,da] = d.split('-').map(Number);
  const [h,mi] = t.split(':').map(Number);
  return new Date(y, mo-1, da, h, mi);
}
const pad = n => String(n).padStart(2,'0');

let times = [];
let charts = {};
let currentPlace = null;

const $ = id => document.getElementById(id);
const placeLabel = p => p.name + (p.admin1 ? ', '+p.admin1 : '') + (p.country ? ', '+p.country : '');
const placeKey = p => Number(p.latitude).toFixed(3)+','+Number(p.longitude).toFixed(3);

function setStatus(msg, isErr){
  const el = $('status'); el.textContent = msg || ''; el.className = 'status' + (isErr ? ' err' : '');
}

/* ---------- Ulubione (localStorage) ---------- */
function getFavs(){ try{ return JSON.parse(localStorage.getItem('meteogram_favs') || '[]'); }catch(e){ return []; } }
function saveFavs(list){ try{ localStorage.setItem('meteogram_favs', JSON.stringify(list)); }catch(e){} }
function isFav(p){ return getFavs().some(f => placeKey(f) === placeKey(p)); }
function addFav(p){
  const list = getFavs();
  if(!list.some(f => placeKey(f) === placeKey(p))){
    list.push({name:p.name, admin1:p.admin1||'', country:p.country||'', latitude:p.latitude, longitude:p.longitude});
    saveFavs(list); renderFavs();
  }
}
function removeFav(p){ saveFavs(getFavs().filter(f => placeKey(f) !== placeKey(p))); renderFavs(); updateStar(); }
function renderFavs(){
  const list = getFavs();
  const w = $('favsWrap');
  if(list.length === 0){ w.innerHTML = '<div class="favs-empty">Brak ulubionych. Wyszukaj miejscowość na dole i dotknij „☆ Zapisz”.</div>'; return; }
  const box = document.createElement('div'); box.className = 'favs';
  list.forEach(f=>{
    const chip = document.createElement('div'); chip.className = 'chip';
    const name = document.createElement('span'); name.className = 'name'; name.textContent = f.name;
    name.onclick = ()=>{ loadPlace(f); $('picker').innerHTML=''; };
    const rm = document.createElement('button'); rm.className = 'rm'; rm.textContent = '×'; rm.title = 'Usuń';
    rm.onclick = (e)=>{ e.stopPropagation(); removeFav(f); };
    chip.appendChild(name); chip.appendChild(rm); box.appendChild(chip);
  });
  w.innerHTML = ''; w.appendChild(box);
}
function updateStar(){
  const b = $('star');
  if(currentPlace && isFav(currentPlace)){ b.textContent = '★ Zapisane'; b.classList.add('on'); }
  else { b.textContent = '☆ Zapisz'; b.classList.remove('on'); }
}
$('star').addEventListener('click', ()=>{
  if(!currentPlace) return;
  if(isFav(currentPlace)) removeFav(currentPlace); else addFav(currentPlace);
  updateStar();
});

/* ---------- API ---------- */
async function geocode(name){
  const url = 'https://geocoding-api.open-meteo.com/v1/search?count=5&language=pl&format=json&name=' + encodeURIComponent(name);
  const r = await fetch(url);
  if(!r.ok) throw new Error('Błąd wyszukiwania miejscowości.');
  const j = await r.json();
  return j.results || [];
}
async function getForecast(lat, lon){
  const hourly = ['temperature_2m','apparent_temperature','precipitation','precipitation_probability',
    'cloud_cover','wind_speed_10m','wind_gusts_10m','relative_humidity_2m','surface_pressure','cape','weather_code'].join(',');
  const current = ['temperature_2m','apparent_temperature','weather_code','wind_speed_10m','relative_humidity_2m'].join(',');
  const url = 'https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+
    '&hourly='+hourly+'&current='+current+'&forecast_days=7&timezone=auto';
  const r = await fetch(url);
  if(!r.ok) throw new Error('Nie udało się pobrać prognozy.');
  return r.json();
}

/* ---------- Wykresy ---------- */
function xScale(){
  return {
    type:'category',
    ticks:{
      color:'#93a2bd', font:{size:10}, autoSkip:false, maxRotation:0, minRotation:0,
      callback:(v,i)=>{
        const d = times[i]; if(!d) return '';
        const h = d.getHours();
        if(h===0) return DAYS[d.getDay()]+' '+pad(d.getDate())+'.'+pad(d.getMonth()+1);
        if(h===12) return '12:00';
        return '';
      }
    },
    grid:{ color:(ctx)=>{ const d=times[ctx.index]; return (d && d.getHours()===0) ? 'rgba(255,255,255,0.18)' : 'rgba(255,255,255,0.05)'; } }
  };
}
function baseOpts(extraY){
  return {
    responsive:true, maintainAspectRatio:false, animation:false,
    interaction:{mode:'index', intersect:false},
    plugins:{
      legend:{labels:{color:'#e8eef7', font:{size:11}, boxWidth:14}},
      tooltip:{ callbacks:{ title:(items)=>{ const d=times[items[0].dataIndex]; return DAYS[d.getDay()]+', '+pad(d.getDate())+'.'+pad(d.getMonth()+1)+', '+pad(d.getHours())+':00'; } } }
    },
    scales: Object.assign({ x: xScale() }, extraY)
  };
}
const yAxis = (label, opts={}) => Object.assign({ ticks:{color:'#93a2bd', font:{size:10}}, grid:{color:'rgba(255,255,255,0.05)'} }, opts);
function destroyCharts(){ Object.values(charts).forEach(c=>c && c.destroy()); charts={}; }

function render(data){
  const h = data.hourly;
  const labels = h.time;
  times = h.time.map(parseLocal);
  const cape = h.cape || [];
  const wcode = h.weather_code || [];
  const storm = labels.map((_,i)=> stormChance(cape[i], wcode[i]));
  destroyCharts();

  charts.temp = new Chart($('cTemp'), {
    type:'line',
    data:{ labels, datasets:[
      {label:'Temperatura', data:h.temperature_2m, borderColor:'#ff7a45', backgroundColor:'rgba(255,122,69,0.12)', borderWidth:2, pointRadius:0, tension:0.35, fill:true},
      {label:'Odczuwalna', data:h.apparent_temperature, borderColor:'#ffc069', borderWidth:1.5, borderDash:[4,3], pointRadius:0, tension:0.35, fill:false}
    ]},
    options: baseOpts({ y: yAxis('°C') })
  });
  charts.precip = new Chart($('cPrecip'), {
    type:'bar',
    data:{ labels, datasets:[
      {type:'bar', label:'Opady (mm)', data:h.precipitation, backgroundColor:'#4f8cff', yAxisID:'y', barPercentage:1, categoryPercentage:1},
      {type:'line', label:'Szansa (%)', data:h.precipitation_probability, borderColor:'#7ee0c0', borderWidth:1.5, pointRadius:0, tension:0.3, yAxisID:'y1', fill:false}
    ]},
    options: baseOpts({ y: yAxis('mm', {position:'left', beginAtZero:true}), y1: yAxis('%', {position:'right', min:0, max:100, grid:{drawOnChartArea:false}}) })
  });
  charts.storm = new Chart($('cStorm'), {
    type:'line',
    data:{ labels, datasets:[
      {label:'Szansa burzy', data:storm, borderColor:'#b06bff', backgroundColor:'rgba(176,107,255,0.22)', borderWidth:1.5, pointRadius:0, tension:0.3, fill:true}
    ]},
    options: baseOpts({ y: yAxis('%', {min:0, max:100}) })
  });
  charts.cloud = new Chart($('cCloud'), {
    type:'line',
    data:{ labels, datasets:[ {label:'Zachmurzenie', data:h.cloud_cover, borderColor:'#aab7cf', backgroundColor:'rgba(170,183,207,0.25)', borderWidth:1.5, pointRadius:0, tension:0.3, fill:true} ]},
    options: baseOpts({ y: yAxis('%', {min:0, max:100}) })
  });
  charts.wind = new Chart($('cWind'), {
    type:'line',
    data:{ labels, datasets:[
      {label:'Wiatr', data:h.wind_speed_10m, borderColor:'#5ec8ff', borderWidth:2, pointRadius:0, tension:0.3, fill:false},
      {label:'Porywy', data:h.wind_gusts_10m, borderColor:'#9a7bff', borderWidth:1.5, borderDash:[4,3], pointRadius:0, tension:0.3, fill:false}
    ]},
    options: baseOpts({ y: yAxis('km/h', {beginAtZero:true}) })
  });
  charts.humpres = new Chart($('cHumPres'), {
    type:'line',
    data:{ labels, datasets:[
      {label:'Wilgotność (%)', data:h.relative_humidity_2m, borderColor:'#7ee0c0', borderWidth:1.5, pointRadius:0, tension:0.3, yAxisID:'y', fill:false},
      {label:'Ciśnienie (hPa)', data:h.surface_pressure, borderColor:'#ffd166', borderWidth:1.5, pointRadius:0, tension:0.3, yAxisID:'y1', fill:false}
    ]},
    options: baseOpts({ y: yAxis('%', {position:'left', min:0, max:100}), y1: yAxis('hPa', {position:'right', grid:{drawOnChartArea:false}}) })
  });
  $('charts').style.display = 'block';
}

function showCurrent(data, place){
  const c = data.current;
  const [desc, emoji] = wmo(c.weather_code);
  $('curEmoji').textContent = emoji;
  $('curTemp').textContent = Math.round(c.temperature_2m) + '°C';
  $('curDesc').textContent = desc;
  $('curMeta').textContent = 'Odczuwalna ' + Math.round(c.apparent_temperature) + '°C · Wilgotność ' +
    c.relative_humidity_2m + '% · Wiatr ' + Math.round(c.wind_speed_10m) + ' km/h';
  $('curLoc').textContent = placeLabel(place);
  $('current').style.display = 'flex';
}

async function loadPlace(place){
  currentPlace = place;
  try{
    setStatus('Pobieram prognozę…');
    const data = await getForecast(place.latitude, place.longitude);
    showCurrent(data, place);
    render(data);
    updateStar();
    setStatus('');
    window.scrollTo({top:0, behavior:'smooth'});
  }catch(e){ setStatus(e.message || 'Wystąpił błąd.', true); }
}

async function search(){
  const name = $('q').value.trim();
  $('picker').innerHTML = '';
  if(!name){ setStatus('Wpisz nazwę miejscowości.', true); return; }
  try{
    setStatus('Szukam miejscowości…');
    const results = await geocode(name);
    if(results.length === 0){ setStatus('Nie znaleziono takiej miejscowości.', true); return; }
    if(results.length === 1){ setStatus(''); loadPlace(results[0]); return; }
    setStatus('Znaleziono kilka miejscowości — wybierz właściwą:');
    const sel = document.createElement('select');
    results.forEach((r,i)=>{ const o = document.createElement('option'); o.value = i; o.textContent = placeLabel(r); sel.appendChild(o); });
    sel.onchange = ()=> loadPlace(results[sel.value]);
    $('picker').appendChild(sel);
    loadPlace(results[0]);
  }catch(e){ setStatus(e.message || 'Wystąpił błąd.', true); }
}

function useMyLocation(){
  if(!navigator.geolocation){ setStatus('Twoja przeglądarka nie udostępnia lokalizacji.', true); return; }
  setStatus('Ustalam Twoją lokalizację…');
  navigator.geolocation.getCurrentPosition(
    pos=>{ loadPlace({name:'Moja lokalizacja', admin1:'', country:'', latitude:pos.coords.latitude, longitude:pos.coords.longitude}); },
    err=>{ setStatus('Nie udało się ustalić lokalizacji (brak zgody lub błąd).', true); },
    {enableHighAccuracy:false, timeout:10000, maximumAge:600000}
  );
}

$('go').addEventListener('click', search);
$('geo').addEventListener('click', useMyLocation);
$('q').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); search(); } });

/* Start: pokaż ulubione i wczytaj domyślnie Warszawę */
renderFavs();
loadPlace({name:'Warszawa', admin1:'Województwo mazowieckie', country:'Polska', latitude:52.2298, longitude:21.0118});
</script>
</body>
</html>
